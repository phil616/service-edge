server:
  listen: "0.0.0.0:8443"
  external_url: "https://edge-api.example.com"

database:
  path: "/var/lib/service-edge/data.db"

# Control-plane-only master key used to derive role/UUID-bound Agent credentials.
# Never distribute this key to agents. NOT the frpc <-> frps token. Use 64 random chars.
agent_api_token: "CHANGE_ME_agent_api_token_64_random_chars________________________"

# JWT signing secret for user login. Recommend 64 random chars.
jwt_secret: "CHANGE_ME_jwt_secret_64_random_chars_____________________________"

# Control-plane CA (root or valid intermediate). Must load & validate at startup
# or the server panics and exits.
pki:
  ca_cert: "/etc/service-edge/ca.crt"
  ca_key: "/etc/service-edge/ca.key"

# FRP archives must be uploaded by an administrator before applying a non-empty
# configuration. Agent enrollment and empty-host cleanup do not require an archive. The old base_url field is retained for compatibility
# but is never used for automatic downloads.
frp_release:
  default_version: "v0.61.1"

# Optional install script URL; defaults to server.external_url + /install.
# install_script_base: "https://edge-api.example.com/install"

# Optional binary URL; defaults to server.external_url + /download/agent.
# Per-architecture suffix is appended.
# agent_download_base: "https://edge-api.example.com/download/agent"

# One-time enrollment token TTL.
enrollment_token_ttl: "15m"

cors:
  allowed_origins:
    - "https://edge.example.com"

logging:
  level: "info"
  path: "/var/log/service-edge/server.log"

# Initial admin user created on first boot if no users exist.
bootstrap_admin:
  username: "admin"
  password: "admin12345"
